<!DOCTYPE html>
<html>
<head><title>Craon DevOps App</title></head>
<body style="font-family: sans-serif; max-width: 600px; margin: 40px auto;">
  <h2>Craon Task Tracker</h2>
  <input id="itemInput" placeholder="Enter item..." />
  <button onclick="addItem()">Add</button>
  <ul id="list"></ul>
  <script>
    async function load() {
      const res = await fetch('/api/items');
      const data = await res.json();
      document.getElementById('list').innerHTML = Array.isArray(data)
        ? data.map(i => `<li>${i.name}</li>`).join('')
        : `<li>Error: ${data.error}</li>`;
    }
    async function addItem() {
      const name = document.getElementById('itemInput').value;
      await fetch('/api/items', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name}) });
      load();
    }
    load();
  </script>
</body>
</html>
