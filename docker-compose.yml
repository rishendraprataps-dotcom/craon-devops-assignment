services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: ./app/backend
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017/craondb
      - APP_VERSION=v1
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./app/frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  mongo_data:
