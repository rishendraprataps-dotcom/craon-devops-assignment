name: CD - Deploy to ECS
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag with SHA, and Push Images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/craon-app-backend:$SHA ./app/backend
          docker push $REGISTRY/craon-app-backend:$SHA

          docker build -t $REGISTRY/craon-app-frontend:$SHA ./app/frontend
          docker push $REGISTRY/craon-app-frontend:$SHA

      - name: Update ECS Services
        run: |
          aws ecs update-service --cluster craon-app-cluster --service craon-app-backend-svc --force-new-deployment
          aws ecs update-service --cluster craon-app-cluster --service craon-app-frontend-svc --force-new-deployment
